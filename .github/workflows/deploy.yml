name: Deploy to Cloudflare Pages
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pnpm install
      # Preset cloudflare-pages: HTML prerenderizado + _worker.js para /api/* en ./dist
      - run: pnpm build
      # Secretos del repo (Settings → Secrets and variables → Actions):
      # CLOUDFLARE_API_TOKEN (permiso "Cloudflare Pages: Edit") y CLOUDFLARE_ACCOUNT_ID
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=joangarfias --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
